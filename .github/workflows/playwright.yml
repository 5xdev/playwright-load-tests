name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        browser: [chromium]
        session: [
            "cc-a0ff81fe0626",
            # "s002",
            # "s003",
            # "s004",
            # "s005",
            # "s006",
            # "s007",
            # "s008",
            # "s009",
            # "s010",
            # "s011",
            # "s012",
            # "s013",
            # "s014",
            # "s015",
            # "s016",
            # "s017",
            # "s018",
            # "s019",
            # "s020",
          ]
        user:
          [
            "u001",
            "u002",
            "u003",
            "u004",
            "u005",
            "u006",
            "u007",
            "u008",
            "u009",
            "u010",
            "u011",
            "u012",
            "u013",
            "u014",
            "u015",
            "u016",
            "u017",
            "u018",
            "u019",
            "u020",
            "u021",
            "u022",
            "u023",
            "u024",
            "u025",
            "u026",
            "u027",
            "u028",
            "u029",
            "u030",
            "u031",
            "u032",
            "u033",
            "u034",
            "u035",
            "u036",
            "u037",
            "u038",
            "u039",
            "u040",
          ]
        # os: [ubuntu-latest, windows-latest, macos-latest]
        # browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: SESSION_ID=${{ matrix.session }} USERNAME=${{ matrix.user }} npx playwright test
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ss-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.session }}-${{ matrix.user }}
          path: fullpage.png
